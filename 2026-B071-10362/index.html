<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet"
    href="style.css">
</head>
<body>
    <div class="calculator">
        <input type="text" id="display" 
        readonly>
        <div class="buttons">
            <button 
            onclick="cleardisplay()">AC</button>
        <button
    onclick="appendValue('00')">00</button>
    <button 
    onclick="appendValue('%')">%</button>
<button class="operator"
onclick="appendValue('/')">&divide;</button>
<button
onclick="appendValue('7')">7</button>
<button
onclick="appendValue('8')">8</button>
<button
onclick="appendvalue('9')">9</button>
<button class="operator"
onclick="appendvalue('*')">x</button>
<button
onclick="appendValue('4')">4</button>
<button
onclick="appendValue('5')">5</button>
<button
onclick="appendValue('6')">6</button>
<button class="operator"
onclick="appendValue('-')">-</button>
<button
onclick="appendValue('1')">1</button>
<button
onclick="appendValue('2')">2</button>
<button
onclick="appendValue('3')">3</button>
<button class="operator"
oncliick="appendValue('+')">+</button>
<button class="zero"
onclick="appendValue('0')">0</button>
<button 
onclick="appendValue('.')">.</button>
<button class="operator"
onclick="calculate()"class="equal">=</button>
        </div>
</div>
</body>
</html>
